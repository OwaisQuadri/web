<!doctype html>
<meta charset="utf-8">
<title>CEF audio probe</title>
<style>body { font: 16px sans-serif; margin: 20px; } iframe { width: 100%; height: 160px; border: 1px solid #888; }</style>
<main>
<h1 id="label">Audio probe</h1>
<button id="start">Start tab sources</button>
<button id="stop" disabled>Stop tab sources</button>
<audio id="media" controls></audio>
<iframe id="frame" title="Distinct-origin audio probe"></iframe>
</main>
<script>
const tab = new URLSearchParams(location.search).get('tab') ?? 'unknown';
const frequencies = tab === 'two' ? [311, 467] : [193, 277];
document.querySelector('#label').textContent = `Audio probe tab ${tab}`;
document.querySelector('#start').textContent = `Start tab ${tab} sources`;
document.querySelector('#stop').textContent = `Stop tab ${tab} sources`;
const frameHost = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
document.querySelector('#frame').src = `${location.protocol}//${frameHost}:${location.port}/audio-frame.html?tab=${encodeURIComponent(tab)}`;
let context;
let oscillator;
let mediaUrl;
function wav(frequency) {
  const rate = 44100; const frames = rate; const bytes = new ArrayBuffer(44 + frames * 2); const view = new DataView(bytes);
  for (const [offset, value] of [[0, 'RIFF'], [8, 'WAVE'], [12, 'fmt '], [36, 'data']]) for (let i = 0; i < value.length; i += 1) view.setUint8(offset + i, value.charCodeAt(i));
  view.setUint32(4, 36 + frames * 2, true); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); view.setUint32(40, frames * 2, true);
  for (let frame = 0; frame < frames; frame += 1) view.setInt16(44 + frame * 2, Math.sin(frame * frequency * 2 * Math.PI / rate) * 900, true);
  return new Blob([bytes], { type: 'audio/wav' });
}
function event(action, source) { console.log(`CEF_AUDIO_EVENT:${JSON.stringify({ action, source, url: location.href, timestamp: performance.now(), time_origin_ms: performance.timeOrigin })}`); }
function start() {
  event('start', 'tab-sources');
  context = new AudioContext(); oscillator = context.createOscillator(); oscillator.frequency.value = frequencies[0]; const gain = context.createGain(); gain.gain.value = 0.015; oscillator.connect(gain).connect(context.destination); oscillator.start();
  mediaUrl = URL.createObjectURL(wav(frequencies[1])); const media = document.querySelector('#media'); media.src = mediaUrl; media.volume = 0.015; media.loop = true; media.play();
  document.querySelector('#start').disabled = true; document.querySelector('#stop').disabled = false;
}
function stop() { event('stop', 'tab-sources'); oscillator?.stop(); context?.close(); document.querySelector('#media').pause(); if (mediaUrl) URL.revokeObjectURL(mediaUrl); document.querySelector('#start').disabled = false; document.querySelector('#stop').disabled = true; }
document.querySelector('#start').addEventListener('click', start); document.querySelector('#stop').addEventListener('click', stop);
</script>

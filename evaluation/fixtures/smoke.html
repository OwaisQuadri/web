<!doctype html>
<meta charset="utf-8">
<title>Engine smoke fixture</title>
<style>
body { font: 16px -apple-system, sans-serif; margin: 20px; background: #f7f7f7; }
main { max-width: 760px; padding: 18px; background: white; border: 1px solid #bbb; }
#frame { font-variant-numeric: tabular-nums; }
canvas { border: 1px solid #333; display: block; margin: 12px 0; }
iframe { width: 100%; height: 45px; border: 1px solid #888; }
</style>
<main>
<h1>Engine smoke</h1>
<p id="ready">ready</p>
<p>frame <output id="frame">0</output></p>
<p>storage <output id="storage">empty</output></p>
<label>input <input id="input" value="synthetic input"></label>
<canvas id="canvas" width="240" height="48"></canvas>
<iframe src="/frame.html" title="fixture frame"></iframe>
</main>
<script>
const parameters = new URLSearchParams(location.search);
if (parameters.has('value')) localStorage.setItem('smoke-store', parameters.get('value'));
document.cookie = 'smoke-cookie=present; SameSite=Strict';
document.querySelector('#storage').textContent = localStorage.getItem('smoke-store') ?? 'empty';
window.fixtureResults = { database: 'pending', serviceWorker: 'pending', cache: 'pending' };
const database = indexedDB.open('smoke-db', 1);
database.onupgradeneeded = event => event.target.result.createObjectStore('values');
database.onsuccess = event => {
  event.target.result.close();
  window.fixtureResults.database = 'ready';
};
database.onerror = () => { window.fixtureResults.database = String(database.error); };
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/worker.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => { window.fixtureResults.serviceWorker = 'ready'; })
    .catch(error => { window.fixtureResults.serviceWorker = String(error); });
} else {
  window.fixtureResults.serviceWorker = 'unsupported';
}
if ('caches' in window) {
  caches.open('smoke-cache')
    .then(cache => cache.put('/cache-probe', new Response('fixture')))
    .then(() => { window.fixtureResults.cache = 'ready'; })
    .catch(error => { window.fixtureResults.cache = String(error); });
} else {
  window.fixtureResults.cache = 'unsupported';
}
const canvas = document.querySelector('#canvas');
const context = canvas.getContext('2d');
let frame = 0;
function draw() {
  frame += 1;
  document.querySelector('#frame').textContent = String(frame);
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = '#1769aa';
  context.fillRect(frame % 210, 10, 30, 28);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>

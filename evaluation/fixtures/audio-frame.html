<!doctype html>
<meta charset="utf-8">
<title>CEF audio frame probe</title>
<button id="start">Start frame source</button>
<button id="stop" disabled>Stop frame source</button>
<script>
const tab = new URLSearchParams(location.search).get('tab') ?? 'unknown';
const frequency = tab === 'two' ? 719 : 593;
document.querySelector('#start').textContent = `Start frame ${tab} source`;
document.querySelector('#stop').textContent = `Stop frame ${tab} source`;
let context;
let oscillator;
function event(action, source) { console.log(`CEF_AUDIO_EVENT:${JSON.stringify({ action, source, url: location.href, timestamp: performance.now(), time_origin_ms: performance.timeOrigin })}`); }
function start() {
  event('start', 'frame-source');
  context = new AudioContext(); oscillator = context.createOscillator(); oscillator.frequency.value = frequency; const gain = context.createGain(); gain.gain.value = 0.015; oscillator.connect(gain).connect(context.destination); oscillator.start();
  document.querySelector('#start').disabled = true; document.querySelector('#stop').disabled = false;
}
function stop() { event('stop', 'frame-source'); oscillator?.stop(); context?.close(); document.querySelector('#start').disabled = false; document.querySelector('#stop').disabled = true; }
document.querySelector('#start').addEventListener('click', start); document.querySelector('#stop').addEventListener('click', stop);
</script>
